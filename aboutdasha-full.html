<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasha Mamba - Portfolio</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="img/dasha.png" />

    <!-- Open Graph / Social Media Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dasha-mamba.com/" />
    <meta property="og:title" content="Dasha Mamba - Portfolio" />
    <meta property="og:description" content="Portfolio of Dasha Mamba - Artist and Designer" />
    <meta property="og:image" content="https://dasha-mamba.com/img/header.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://dasha-mamba.com/" />
    <meta name="twitter:title" content="Dasha Mamba - Portfolio" />
    <meta name="twitter:description" content="Portfolio of Dasha Mamba - Artist and Designer" />
    <meta name="twitter:image" content="https://dasha-mamba.com/img/header.jpg" />

    <link rel="stylesheet" href="css/about-full.css">
    <link rel="stylesheet" href="css/back-button.css">
</head>
<body>
    <!-- Back Button -->
    <button class="back-button" onclick="window.location.href='about.html'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Back
    </button>
    <div class="fullscreen-image-container">
        <!-- Image with glitch effect -->
        <div class="image-link-wrapper" id="imageLayer">
            <img src="img/aboutdasha.jpg" alt="About Dasha Mamba" class="fullscreen-image" id="mainImage">

            <a class="image-link" href="https://www.instagram.com/dasha.mamba?igsh=cHpoY2djdWp6Zzhq" target="_blank" style="--x: 72%; --y: 6.5%;"><img src="img/dasha_link.svg" alt="Dasha Mamba" style="max-height: 25px;"></a>
            <a class="image-link" href="https://www.instagram.com/arma17ru?igsh=MWZ5dTRza3V5OWZ0cA==" target="_blank" style="--x: 80%; --y: 33%;"><img src="img/arma_link.svg" alt="Arma17"></a>
            <a class="image-link" href="https://on.soundcloud.com/cNkdgYGD3kEml2RBc5" target="_blank" style="--x: 62%; --y: 35%;"><img src="img/radio_link.svg" alt="Radio"></a>
            <a class="image-link" href="https://www.instagram.com/cabaret_paradajz?igsh=cHg2NGpoNXIwcWlj" target="_blank" style="--x: 62%; --y: 39%;"><img src="img/paradajz_link.svg" alt="Paradajz"></a>
            <a class="image-link" href="https://www.instagram.com/outlinefestival?igsh=MW1kbjVpNHVwamttMw==" target="_blank" style="--x: 50%; --y: 44%;"><img src="img/outline_link.svg" alt="Outline"></a>
            <a class="image-link" href="https://www.instagram.com/sensor.festival?igsh=b21ybmQ3b2s2MDJ1" target="_blank" style="--x: 48%; --y: 47.3%;"><img src="img/sensor_link.svg" alt="Sensor"></a>
            <a class="image-link" href="https://www.instagram.com/epizode_official?igsh=NHRpa3k1bzVqeDF0" target="_blank" style="--x: 52%; --y: 49%;"><img src="img/epizode_link.svg" alt="Epizode"></a>
            <a class="image-link" href="https://www.instagram.com/outlinefestival?igsh=MW1kbjVpNHVwamttMw==" target="_blank" style="--x: 51%; --y: 55.5%;"><img src="img/outline_link.svg" alt="Outline"></a>
        </div>
    </div>

    <script>
        // Запускаем глитч эффект при загрузке страницы с задержкой
        document.addEventListener('DOMContentLoaded', () => {
            const imageLayer = document.getElementById('imageLayer');

            // Добавляем класс глюка через 1 секунду после загрузки
            setTimeout(() => {
                imageLayer.classList.add('glitch-on-load');

                // Убираем класс анимации после завершения
                setTimeout(() => {
                    imageLayer.classList.remove('glitch-on-load');
                }, 150);
            }, 150);
        });
    </script>
</body>
</html>
