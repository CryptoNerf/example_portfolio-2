<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Information about me - Dasha Mamba</title>
    <link rel="stylesheet" href="css/about-full.css">
    <link rel="stylesheet" href="css/back-button.css">
</head>
<body>
    <!-- Back Button -->
    <a href="javascript:history.back()" class="back-button">&lt;--</a>
    <div class="fullscreen-image-container">
        <!-- Изображение с глюк-эффектом -->
        <img src="img/aboutdasha.jpg" alt="About Dasha Mamba" class="fullscreen-image glitch-on-load" id="mainImage">
    </div>

    <script>
        // Запускаем глитч эффект при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            const mainImage = document.getElementById('mainImage');

            // Убираем класс анимации после завершения
            setTimeout(() => {
                mainImage.classList.remove('glitch-on-load');
            }, 150);
        });
    </script>
</body>
</html>
