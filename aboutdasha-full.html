<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasha Mamba - Portfolio</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="img/dasha.png" />

    <!-- Open Graph / Social Media Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dasha-mamba.com/" />
    <meta property="og:title" content="Dasha Mamba - Portfolio" />
    <meta property="og:description" content="Portfolio of Dasha Mamba - Artist and Designer" />
    <meta property="og:image" content="https://dasha-mamba.com/img/header.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://dasha-mamba.com/" />
    <meta name="twitter:title" content="Dasha Mamba - Portfolio" />
    <meta name="twitter:description" content="Portfolio of Dasha Mamba - Artist and Designer" />
    <meta name="twitter:image" content="https://dasha-mamba.com/img/header.jpg" />

    <link rel="stylesheet" href="css/about-full.css">
    <link rel="stylesheet" href="css/back-button.css">
</head>
<body>
    <!-- Back Button -->
    <button class="back-button" onclick="window.location.href='about.html'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Back
    </button>
    <div class="fullscreen-image-container">
        <!-- Image with glitch effect -->
        <div class="image-link-wrapper" id="imageLayer">
            <img src="img/aboutdasha.jpg" alt="About Dasha Mamba" class="fullscreen-image" id="mainImage">

            <a class="image-link" href="#" style="--x: 72%; --y: 7%;">Dasha Mamba</a>
            <a class="image-link" href="#" style="--x: 78%; --y: 34%;">Arma17</a>
            <a class="image-link" href="#" style="--x: 62%; --y: 35%;">Radio</a>
            <a class="image-link" href="#" style="--x: 62%; --y: 39%;">Paradiz</a>
            <a class="image-link" href="#" style="--x: 49%; --y: 45%;">Outline</a>
            <a class="image-link" href="#" style="--x: 48%; --y: 47.5%;">Sensor</a>
            <a class="image-link" href="#" style="--x: 52%; --y: 49.5%;">Epizode</a>
            <a class="image-link" href="#" style="--x: 52%; --y: 55.5%;">Outline</a>
        </div>
    </div>

    <script>
        // Запускаем глитч эффект при загрузке страницы с задержкой
        document.addEventListener('DOMContentLoaded', () => {
            const imageLayer = document.getElementById('imageLayer');

            // Добавляем класс глюка через 1 секунду после загрузки
            setTimeout(() => {
                imageLayer.classList.add('glitch-on-load');

                // Убираем класс анимации после завершения
                setTimeout(() => {
                    imageLayer.classList.remove('glitch-on-load');
                }, 150);
            }, 150);
        });
    </script>
</body>
</html>
