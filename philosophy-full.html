<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasha Mamba - Portfolio</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="img/dasha.png" />

    <!-- Open Graph / Social Media Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dasha-mamba.com/" />
    <meta property="og:title" content="Dasha Mamba - Portfolio" />
    <meta property="og:description" content="Portfolio of Dasha Mamba - Artist and Designer" />
    <meta property="og:image" content="https://dasha-mamba.com/img/header.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://dasha-mamba.com/" />
    <meta name="twitter:title" content="Dasha Mamba - Portfolio" />
    <meta name="twitter:description" content="Portfolio of Dasha Mamba - Artist and Designer" />
    <meta name="twitter:image" content="https://dasha-mamba.com/img/header.jpg" />

    <link rel="stylesheet" href="css/about-full.css">
    <link rel="stylesheet" href="css/gallery-nav.css">
    <link rel="stylesheet" href="css/back-button.css">
</head>
<body>
    <!-- Back Button -->
    <button class="back-button" onclick="window.location.href='philosophy.html'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Back
    </button>
    <div class="fullscreen-image-container">
        <!-- Изображение с глюк-эффектом -->
        <img src="img/philosophy.jpg" alt="Philosophy of my work" class="fullscreen-image" id="mainImage">

        <!-- Стрелки навигации -->
        <div class="nav-arrow nav-arrow-left" id="navLeft" style="display: none;">
            <svg width="60" height="60" viewBox="0 0 60 60" fill="none">
                <path d="M35 15L20 30L35 45" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div class="nav-arrow nav-arrow-right" id="navRight">
            <svg width="60" height="60" viewBox="0 0 60 60" fill="none">
                <path d="M25 15L40 30L25 45" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
    </div>

    <script>
        // Запускаем глитч эффект при загрузке страницы с задержкой
        document.addEventListener('DOMContentLoaded', () => {
            const mainImage = document.getElementById('mainImage');
            const navLeft = document.getElementById('navLeft');
            const navRight = document.getElementById('navRight');

            const images = [
                'img/philosophy.jpg',
                'img/philosophy2.jpg',
                'img/philosophy3.jpg'
            ];
            let currentIndex = 0;

            // Добавляем класс глюка через 1 секунду после загрузки
            setTimeout(() => {
                mainImage.classList.add('glitch-on-load');

                // Убираем класс анимации после завершения
                setTimeout(() => {
                    mainImage.classList.remove('glitch-on-load');
                }, 150);
            }, 1000);

            // Функция обновления стрелок
            function updateArrows() {
                // Стрелка влево видна если не на первом изображении
                navLeft.style.display = currentIndex > 0 ? 'flex' : 'none';
                // Стрелка вправо видна если не на последнем изображении
                navRight.style.display = currentIndex < images.length - 1 ? 'flex' : 'none';
            }

            // Переход к следующему изображению
            navRight.addEventListener('click', () => {
                if (currentIndex < images.length - 1) {
                    currentIndex++;
                    mainImage.src = images[currentIndex];
                    updateArrows();
                }
            });

            // Переход к предыдущему изображению
            navLeft.addEventListener('click', () => {
                if (currentIndex > 0) {
                    currentIndex--;
                    mainImage.src = images[currentIndex];
                    updateArrows();
                }
            });

            // Инициализация стрелок
            updateArrows();
        });
    </script>
</body>
</html>
