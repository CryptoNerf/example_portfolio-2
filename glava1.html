<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Глава 1 - Фотогалерея</title>
    <link rel="stylesheet" href="css/gallery.css">
</head>
<body>
    <div class="flipbook-container">
        <!-- Кнопка назад -->
        <button class="back-button" onclick="window.location.href='index.html'">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>

        <!-- Контейнер для книги -->
        <div class="book-wrapper">
            <div id="book"></div>
            <!-- Overlay для режима увеличения -->
            <div class="zoom-overlay" id="zoomOverlay"></div>
        </div>

        <!-- Панель управления снизу -->
        <div class="controls">
            <!-- Кнопка сетки -->
            <button class="grid-btn" id="gridBtn" title="Показать сетку">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="3" width="7" height="7" stroke="currentColor" stroke-width="2"/>
                    <rect x="14" y="3" width="7" height="7" stroke="currentColor" stroke-width="2"/>
                    <rect x="3" y="14" width="7" height="7" stroke="currentColor" stroke-width="2"/>
                    <rect x="14" y="14" width="7" height="7" stroke="currentColor" stroke-width="2"/>
                </svg>
            </button>

            <!-- Кнопка поворота -->
            <button class="rotate-btn" id="rotateBtn" title="Повернуть книгу">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M21 12a9 9 0 11-9-9c2.52 0 4.93 1 6.74 2.74L21 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <path d="M21 3v5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <!-- Кнопка увеличения -->
            <button class="zoom-btn" id="zoomBtn" title="Увеличить страницу">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
                    <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <path d="M11 8v6M8 11h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>

            <!-- Кнопка назад -->
            <button class="nav-control-btn" id="prevPageBtn" title="Предыдущая страница">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>

            <!-- Слайдер прогресса -->
            <input type="range" class="progress-slider" id="progressSlider"
                   min="0" max="95" value="0" step="1">

            <!-- Кнопка вперед -->
            <button class="nav-control-btn" id="nextPageBtn" title="Следующая страница">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>

            <!-- Счетчик фото -->
            <div class="photo-counter">
                <span id="currentPhoto">1</span>/<span id="totalPhotos">96</span>
            </div>
        </div>

        <!-- Модальное окно с сеткой -->
        <div class="grid-modal" id="gridModal">
            <div class="grid-header">
                <h3>Все фотографии</h3>
                <button class="close-grid" id="closeGrid">✕</button>
            </div>
            <div class="grid-container" id="gridContainer">
                <!-- Миниатюры будут добавлены через JavaScript -->
            </div>
        </div>

        <!-- Модальное окно увеличения -->
        <div class="zoom-modal" id="zoomModal">
            <button class="close-zoom" id="closeZoom">✕</button>
            <div class="zoom-container" id="zoomContainer">
                <img id="zoomImage" src="" alt="Увеличенное изображение">
            </div>
            <div class="zoom-controls">
                <button class="zoom-control-btn" id="zoomOutBtn" title="Уменьшить">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
                        <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M8 11h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <span class="zoom-level" id="zoomLevel">100%</span>
                <button class="zoom-control-btn" id="zoomInBtn" title="Увеличить">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
                        <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M11 8v6M8 11h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <button class="zoom-control-btn" id="rotateImageBtn" title="Повернуть">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M21 12a9 9 0 11-9-9c2.52 0 4.93 1 6.74 2.74L21 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M21 3v5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button class="zoom-control-btn" id="zoomResetBtn" title="Сбросить">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M3 12a9 9 0 0113-8v0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M21 12a9 9 0 01-13 8v0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M16 4v4h-4M8 20v-4h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- StPageFlip библиотека -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
    <script src="js/gallery-flip.js"></script>
</body>
</html>
